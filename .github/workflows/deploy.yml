name: Deploy to staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            git -C /opt/skill-matrix/repo fetch origin ${{ github.sha }}
            git -C /opt/skill-matrix/repo show ${{ github.sha }}:deploy/auto-deploy.sh | bash -s -- ${{ github.sha }}
