name: skill-matrix

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - /etc/skill-matrix/postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - skill-matrix-postgres:/var/lib/postgresql/data
    networks:
      - skill-matrix

volumes:
  skill-matrix-postgres:

networks:
  skill-matrix:
    name: skill-matrix
