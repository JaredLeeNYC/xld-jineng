name: skill-matrix-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skill_matrix
      POSTGRES_USER: skill_matrix
      POSTGRES_PASSWORD: skill_matrix_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skill_matrix -d skill_matrix"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - skill-matrix-postgres:/var/lib/postgresql/data

volumes:
  skill-matrix-postgres:
